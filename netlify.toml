[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  TRUST_PROXY = "true"
  COOKIE_SECURE = "true"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  included_files = ["article.html", "articles.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/readme.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/server?__route=/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/server?__route=/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301
  force = true

[[redirects]]
  from = "/articles.html"
  to = "/articles"
  status = 301
  force = true

[[redirects]]
  from = "/articles/"
  to = "/.netlify/functions/server?__route=/articles"
  status = 200
  force = true

[[redirects]]
  from = "/articles"
  to = "/.netlify/functions/server?__route=/articles"
  status = 200
  force = true

[[redirects]]
  from = "/articles/*"
  to = "/.netlify/functions/server?__route=/articles/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server?__route=/api/:splat"
  status = 200
  force = true
